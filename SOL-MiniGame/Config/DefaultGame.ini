; Assets that are loaded by path at runtime instead of being hard-referenced.
;
; The cooker only follows hard references (UPROPERTY pointers, FObjectFinder in
; a constructor, anything placed in a level). Anything fetched through
; LoadObject with a string path is invisible to it and simply will not be in the
; packaged build — silently, with no cook warning. For this project that would
; mean:
;   - AnimStarterPack: the four locomotion/death clips are LoadObject'd in
;     ASOLCharacter::BeginPlay, so a packaged build would fall back to the bind
;     pose and every character would slide around without animation again.
;   - Config: DT_SOLContainers / DT_SOLExtractions are loaded from
;     ConfigTablePath strings. Without them the containers drop to the built-in
;     fallback pools (8 items instead of 18) and all three extraction zones
;     collapse to the same C++ defaults, which erases the whole risk/reward
;     gradient.
; SK_Mannequin does not need an entry: it is a constructor FObjectFinder, i.e. a
; real hard reference.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/AnimStarterPack")
+DirectoriesToAlwaysCook=(Path="/Game/Config")
+MapsToCook=(FilePath="/Game/Maps/SOLNewMap")

; Round tuning. ASOLGameMode is UCLASS(Config=Game), so these override the C++
; defaults with no recompile — the same "gameplay numbers live in data"
; principle the loot DataTables follow.
[/Script/SOL.SOLGameMode]
MatchSeconds=360.0
RespawnDelay=5.0
ScavengerCount=3
ScavengerSpawnOffset=700.0
